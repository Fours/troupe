name: CI

on:
  # Branches only: a v* tag runs these same jobs through release.yml, before it publishes.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    # A dispatcher bug can hang a test in a sync loop no Vitest timeout can interrupt.
    timeout-minutes: 10
    strategy:
      matrix:
        # Every supported LTS line. Keep in step with engines in package.json.
        node: [22.x, 24.x, 26.x]
    # For npm run test:integration. The same image and port as docker-compose.test.yml.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: troupe
          POSTGRES_PASSWORD: troupe
          POSTGRES_DB: troupe
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U troupe -d troupe"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    # Required in CI: without it, the integration tests fail rather than guess (test/helpers).
    env:
      TROUPE_POSTGRES_URL: postgres://troupe:troupe@localhost:5440/troupe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      # Runs unit and integration together, and enforces the 90% line threshold.
      - run: npm run coverage
      - run: npm run build
      # What npm users get: only dist/, the README, the licence and the changelog ship, with every
      # entry point, the table SQL and the Backstage UI, and no dependencies (scripts/check-pack.ts);
      # package.json and its exports are valid (publint); and every entry point's types resolve
      # for ESM consumers (attw).
      - run: npm run check:package
      # The milestone demo, on SQLite, on every Node line: node:sqlite differs between them.
      - run: npm run example
      # One small run of each in-memory scenario, so the benchmark can't rot. The numbers from
      # shared runners mean nothing and are never kept (decision 0019).
      - run: npm run bench -- --quick
        timeout-minutes: 1

  # The demo in a real browser: Playwright on Chromium against the built site. A job of its own,
  # so Chromium installs once, not once per Node version.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Rehearsal (milestone 5, T6): festival night's scenario on seeds 1 to 1,000 in each network
  # mode, across the runner's cores, with every hundredth seed run twice and its histories compared
  # byte for byte. Every invariant fails the job, since T7's hunt fixed what failed. The planted
  # bugs' and the hunt's regression plans run in npm test. Each mode has two minutes of its own:
  # one mode has taken 27 to 65 s on GitHub's runners, so both in one shared budget flaked.
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Rehearse seeds 1 to 1,000 in contract mode
        timeout-minutes: 2
        run: node scripts/rehearse.ts --seeds 1..1000 --mode contract --determinism-every 100
      - name: Rehearse seeds 1 to 1,000 in chaos mode
        timeout-minutes: 2
        run: node scripts/rehearse.ts --seeds 1..1000 --mode chaos --determinism-every 100

  # Real processes: three festival-night nodes and a crowd from examples/cluster/, on TCP and
  # Postgres, killed with kill -9 and stopped gracefully (milestone 4, T8). A job of its own, on
  # one Node line, since its timings are real ones and its processes want the runner to themselves.
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: troupe
          POSTGRES_PASSWORD: troupe
          POSTGRES_DB: troupe
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U troupe -d troupe"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      TROUPE_POSTGRES_URL: postgres://troupe:troupe@localhost:5440/troupe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run test:cluster

  # The cluster demo as people run it: docker-compose.cluster.yml built from this checkout, with
  # node-2 killed and started again (milestone 4, T10). Its own job, since it builds the image.
  cluster-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - run: npm run cluster:smoke
